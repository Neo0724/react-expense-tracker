services:
  client:
    build:
      context: ./Client
      dockerfile: ./Dockerfile
    container_name: expense-tracker-frontend
    ports:
      - "5173:5173"
    env_file:
      - path: ./Client/.env
    environment:
      - VITE_BACKEND_URL=http://localhost:8080/api/v1
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: ./ServerGo
      dockerfile: ./Dockerfile
    container_name: expense-tracker-backend
    ports:
      - "8080:8080"
    env_file:
      - path: ./ServerGo/.env
    environment:
      - DOMAIN=localhost
    restart: unless-stopped
